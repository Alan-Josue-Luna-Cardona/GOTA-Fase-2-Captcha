<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">
    Oficina del Agua (GOTA) — Fase 2: solución integrada
  </text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">
    Módulo entregado en este repositorio: Consulta pública con captcha
  </text>

  <!-- Docker Compose boundary -->
  <rect x="40" y="90" width="880" height="330" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="56" y="112" font-size="12.5" fill="#6b7280" font-weight="600">docker-compose.yml (orquesta los tres servicios)</text>

  <!-- Navegador -->
  <rect x="400" y="130" width="160" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="480" y="154" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Navegador</text>
  <text x="480" y="172" text-anchor="middle" font-size="11.5" fill="#4338ca">Persona usuaria</text>

  <!-- GOTA monolito -->
  <rect x="120" y="250" width="280" height="110" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="260" y="278" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">GOTA (monolito)</text>
  <text x="260" y="297" text-anchor="middle" font-size="11.5" fill="#047857">CodeIgniter 4 · PHP 8.2</text>
  <text x="260" y="313" text-anchor="middle" font-size="11.5" fill="#047857">Puerto 8080</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#059669" font-style="italic">Sin modificaciones en esta entrega</text>
  <text x="260" y="347" text-anchor="middle" font-size="10.5" fill="#059669">Gestión completa de la Oficina del Agua</text>

  <!-- Módulo captcha -->
  <rect x="560" y="250" width="280" height="110" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="700" y="278" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">Consulta pública con captcha</text>
  <text x="700" y="297" text-anchor="middle" font-size="11.5" fill="#1d4ed8">PHP 8.2 independiente (sin framework)</text>
  <text x="700" y="313" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Puerto 8081</text>
  <text x="700" y="332" text-anchor="middle" font-size="10.5" fill="#2563eb">Login y creación de usuario</text>
  <text x="700" y="347" text-anchor="middle" font-size="10.5" fill="#2563eb">protegidos con reCAPTCHA v2</text>

  <!-- Base de datos -->
  <rect x="340" y="400" width="280" height="86" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="480" y="428" text-anchor="middle" font-size="14.5" font-weight="700" fill="#78350f">Base de datos compartida</text>
  <text x="480" y="446" text-anchor="middle" font-size="11.5" fill="#b45309">MariaDB 10.11 · esquema "gota"</text>
  <text x="480" y="462" text-anchor="middle" font-size="10.5" fill="#b45309">Tablas Usuarios y Roles (entre otras)</text>

  <!-- Google reCAPTCHA (externo) -->
  <rect x="700" y="470" width="220" height="80" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="810" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">Google reCAPTCHA</text>
  <text x="810" y="516" text-anchor="middle" font-size="10.5" fill="#be185d">Sistema externo</text>
  <text x="810" y="532" text-anchor="middle" font-size="10" fill="#be185d">siteverify (consulta pública)</text>

  <!-- Flechas -->
  <line x1="450" y1="186" x2="290" y2="250" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="340" y="215" font-size="10.5" fill="#4b5563">HTTP</text>

  <line x1="510" y1="186" x2="670" y2="250" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="590" y="215" font-size="10.5" fill="#4b5563">HTTP</text>

  <line x1="280" y1="360" x2="420" y2="400" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="300" y="388" font-size="10" fill="#4b5563">lee / escribe (PDO)</text>

  <line x1="680" y1="360" x2="540" y2="400" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="388" font-size="10" fill="#4b5563">lee / escribe (PDO)</text>

  <line x1="760" y1="360" x2="800" y2="470" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="770" y="420" font-size="10" fill="#4b5563">verifica el</text>
  <text x="770" y="432" font-size="10" fill="#4b5563">token del captcha</text>

  <!-- Nota de integración -->
  <text x="480" y="580" text-anchor="middle" font-size="11.5" fill="#374151">
    El módulo nuevo no llama a GOTA ni modifica su código: solo comparte la misma base de datos.
  </text>
  <text x="480" y="598" text-anchor="middle" font-size="10.5" fill="#6b7280">
    Chatbot con RAG · Pagos por colas · Replicación a NoSQL: módulos de otras rotaciones, fuera del alcance de este repositorio.
  </text>
</svg>
